<div class="login-box items-center">
    <div class="card shadow-2-strong" style="border-radius: 15px; ">
        <div class="mb-2 pb-2 pb-md-0 mb-md-3 mt-2 text-center">
            <div class="md:grid grid-cols-4 flex flex-col md:items-center gap-4 p-4">

                <form>
                    <div class="row text-center justify-content-center">
                        <h3 class="mb-5">Car Model Management</h3>
                    </div>
                    <div class="row text-center justify-content-center">
                        <div class="col-md-6 mb-4">
                            <div class="form-outline d-flex">
                                <label class="form-label" for="carBrand" style="width:200px; margin-right: 80px;">*Brand
                                    :</label>
                                <select id="carBrand" name="carBrand" class="form-control text-center"
                                    [(ngModel)]="this.commonServe.carModelManagement.carBrand" required
                                    #carBrand="ngModel">
                                    <option [ngValue]="" disabled>Select Brand</option>
                                    <option *ngFor="let brand of carBrands" [ngValue]="brand">{{ brand }}</option>
                                </select>

                            </div>
                        </div>
                    </div>

                    <div class="row text-center justify-content-center">
                        <div class="col-md-6 mb-4">
                            <div class="form-outline d-flex">
                                <label class="form-label" for="carClass" style="width:200px; margin-right: 80px;">*Class
                                    :</label>
                                <select id="carClass" name="carClass" class="form-control text-center"
                                    [(ngModel)]="this.commonServe.carModelManagement.carClass" required
                                    #carClass="ngModel">
                                    <option [ngValue]="" disabled>Select Brand</option>
                                    <option *ngFor="let class of carClasses" [ngValue]="class">{{ class }}</option>
                                </select>

                            </div>
                        </div>
                    </div>


                    <div class="row text-center justify-content-center">
                        <div class="col-md-6 mb-4">
                            <div class="form-outline d-flex">
                                <label class="form-label" for="carModel" style="width:200px; margin-right: 80px;">*Model
                                    Name
                                    :</label>
                                <input type="text" placeholder="Model Name" id="carModel" name="carModel" required
                                    minlength="20" [(ngModel)]="this.commonServe.carModelManagement.carModel"
                                    #carModel="ngModel" autocomplete="off" class="form-control text-center">
                            </div>
                        </div>
                    </div>

                    <div class="row text-center justify-content-center">
                        <div *ngIf="modelCode.invalid && (modelCode.dirty || modelCode.touched)"
                            class="errorClass mb-2">
                            <span *ngIf="modelCode.errors?.['alphanumeric']">Only alphanumeric characters are
                                allowed.</span>
                            <span *ngIf="modelCode.errors?.['required']">Model Code is required.</span>
                        </div>
                        <div class="col-md-6 mb-4">
                            <div class="form-outline d-flex">
                                <label class="form-label" for="modelCode"
                                    style="width:200px; margin-right: 80px;">*Model Code :</label>
                                <input type="text" placeholder="Model Name" id="modelCode" name="modelCode" required
                                    minlength="10" [(ngModel)]="this.commonServe.carModelManagement.modelCode"
                                    AlphaNumeric #modelCode="ngModel" autocomplete="off"
                                    class="form-control text-center">
                            </div>
                        </div>
                    </div>


                    <div class="row text-center justify-content-center">
                        <div class="col-md-6 mb-4">
                            <div class="form-outline">
                                <label class="form-label text-center" for="carDesc"
                                    style="width:200px; margin-right: 80px;">*Description:</label>
                                <quill-editor [(ngModel)]="this.commonServe.carModelManagement.carDesc"
                                    [modules]="quillConfig" class="content-editor" [styles]="{'min-height': '120px'}">
                                </quill-editor>
                            </div>
                        </div>
                    </div>

                    <div class="row text-center justify-content-center">
                        <div class="col-md-6 mb-4">
                            <div class="form-outline">
                                <label class="form-label" for="carFeatures"
                                    style="width:200px; margin-right: 80px;">*Features:</label>
                                <quill-editor [(ngModel)]="this.commonServe.carModelManagement.carFeatures"
                                    [modules]="quillConfig" class="content-editor" [styles]="{'min-height': '120px'}">
                                </quill-editor>
                            </div>
                        </div>
                    </div>

                    <div class="row text-center justify-content-center">
                        <div class="col-md-6 mb-4">
                            <div class="form-outline d-flex">
                                <label class="form-label" for="carPrice" style="width:200px; margin-right: 80px;">*Price
                                    :</label>
                                <input type="text" placeholder="Model Name" id="carPrice" name="carPrice" required
                                    minlength="20" [(ngModel)]="this.commonServe.carModelManagement.carPrice"
                                    #carPrice="ngModel" autocomplete="off" class="form-control text-center">
                            </div>
                        </div>
                    </div>

                    <div class="row justify-content-center">
                        <div class="col-md-6 mb-4">
                            <div class="form-outline d-flex">
                                <label class="form-label" for="dateManfacturing"
                                    style="width:200px; margin-right: 80px;">*Date of Manufacturing
                                    :</label>
                                <p-calendar [(ngModel)]="this.commonServe.carModelManagement.dateManfacturing" name="dateManfacturing" [dateFormat]="'dd-mm-yy'"
                                    id="dateManfacturing" [showIcon]="true" icon="pi pi-calendar"></p-calendar>
                                <!-- <p-calendar [(ngModel)]="this.commonServe.carModelManagement.dateManfacturing"
                                 showIcon="true" placeholder="Select Date" id="dateManfacturing" name="dateManfacturing" required></p-calendar> -->
                            </div>
                        </div>
                    </div>

                    <div class="row justify-content-center">
                        <div class="col-md-6 mb-4">
                            <div class="form-outline d-flex">
                                <label class="form-label" for="isActive"
                                    style="width:200px; margin-right: 80px;">Active
                                    :</label>
                                    <input type="checkbox" [(ngModel)]="this.commonServe.carModelManagement.isActive" 
                                    name="isActive" id="isActive" [checked]="this.commonServe.carModelManagement.isActive"/>
                            </div>
                        </div>
                    </div>

                    <div class="row justify-content-center">
                        <div class="col-md-6 mb-4">
                            <div class="form-outline d-flex">
                                <label class="form-label" for="sortOrder"
                                    style="width:200px; margin-right: 80px;">Sort-Order
                                    :</label>
                                    <input type="text" [(ngModel)]="this.commonServe.carModelManagement.sortOrder" 
                                    name="sortOrder" id="sortOrder"/>
                            </div>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
